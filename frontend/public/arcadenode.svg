<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#d946ef"/>
    </linearGradient>
    <linearGradient id="buttonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="url(#brandGradient)"/>
  <!-- Game controller shape -->
  <rect x="15" y="30" width="70" height="40" rx="10" fill="#ffffff"/>
  <!-- D-pad -->
  <rect x="25" y="43" width="18" height="6" rx="1" fill="url(#buttonGradient)"/>
  <rect x="31" y="37" width="6" height="18" rx="1" fill="url(#buttonGradient)"/>
  <!-- Action buttons -->
  <circle cx="65" cy="42" r="5" fill="#4ade80"/>
  <circle cx="75" cy="50" r="5" fill="#f97316"/>
  <circle cx="65" cy="58" r="5" fill="#84cc16"/>
  <!-- Center node indicator -->
  <circle cx="50" cy="50" r="4" fill="url(#buttonGradient)"/>
  <!-- Connection dots (nodes) -->
  <circle cx="50" cy="20" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="50" cy="80" r="3" fill="#ffffff" opacity="0.8"/>
  <line x1="50" y1="23" x2="50" y2="30" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <line x1="50" y1="70" x2="50" y2="77" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
</svg>
